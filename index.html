// ===== 导入弹窗 =====

// 弹窗条目的填空数据
var importBlanks = {};

function openImportModal() {
  loadLibrary().then(function(items) {
    renderImportModal(items);
    document.getElementById('libraryModal').classList.remove('hidden');
  });
}

function renderImportModal(items) {
  var body = document.getElementById('libraryModalBody');

  if (!items || items.length === 0) {
    body.innerHTML = '<div class="library-modal-empty">📖 任务库还是空的，先去「任务库」页面添加条目吧</div>';
    document.getElementById('libraryModalCount').textContent = '已选 0 项';
    document.getElementById('libraryModalImport').disabled = true;
    return;
  }

  importBlanks = {};
  var html = '';
  items.forEach(function(item, idx) {
    importBlanks[idx] = { id: item.id, checked: false, fills: {} };
    // 分解 pattern，把 __ 替换为输入框
    var parts = splitPattern(item.pattern);
    var textHtml = '';
    var hasBlank = false;
    parts.forEach(function(p, pi) {
      if (p === '__') {
        hasBlank = true;
        textHtml += '<span class="lib-blank-input"><input type="text" data-fill="' + idx + '-' + pi + '" placeholder="填空" autocomplete="off"></span>';
      } else if (p) {
        textHtml += '<span class="lib-fixed">' + escapeHtml(p) + '</span>';
      }
    });

    html += '<div class="library-import-item" data-item-idx="' + idx + '">'
      + '<div class="library-import-top">'
        + '<div class="library-import-check" data-check="' + idx + '" data-hasblank="' + (hasBlank ? '1' : '0') + '">&#10003;</div>'
        + '<div class="library-import-text">' + textHtml + '</div>'
      + '</div>'
      + '<div class="library-import-preview" data-preview="' + idx + '" style="display:none;"></div>'
    + '</div>';
  });

  body.innerHTML = html;

  // 绑定输入变化
  body.querySelectorAll('input[data-fill]').forEach(function(inp) {
    inp.addEventListener('input', function() {
      var key = this.dataset.fill;
      var parts = key.split('-');
      var idx = parseInt(parts[0]);
      var pi = parseInt(parts[1]);
      if (importBlanks[idx]) {
        importBlanks[idx].fills[pi] = this.value;
        updatePreview(idx);
        updateImportCount();
      }
    });
    inp.addEventListener('focus', function() {
      this.select();
    });
  });

  updateImportCount();
}

function splitPattern(pattern) {
  // 把 "语文古文__" 分成 ["语文古文", "__"]
  // 把 "数学第__课" 分成 ["数学第", "__", "课"]
  var parts = [];
  var remaining = pattern;
  while (remaining.length > 0) {
    var idx = remaining.indexOf('__');
    if (idx === -1) {
      parts.push(remaining);
      break;
    }
    if (idx > 0) parts.push(remaining.substring(0, idx));
    parts.push('__');
    remaining = remaining.substring(idx + 2);
  }
  return parts;
}

function buildTitleFromParts(pattern, fills) {
  var parts = splitPattern(pattern);
  var fi = 0;
  var title = '';
  parts.forEach(function(p) {
    if (p === '__') {
      title += (fills[fi] && fills[fi].trim()) || '__';
      fi++;
    } else {
      title += p;
    }
  });
  return title;
}

function updatePreview(idx) {
  var item = libraryItems[idx];
  if (!item) return;
  var blank = importBlanks[idx];
  if (!blank) return;
  var previewEl = document.querySelector('[data-preview="' + idx + '"]');
  if (!previewEl) return;

  var hasFill = false;
  var parts = splitPattern(item.pattern);
  var fi = 0;
  var previewParts = [];
  parts.forEach(function(p) {
    if (p === '__') {
      var val = (blank.fills[fi] && blank.fills[fi].trim()) || '';
      if (val) { hasFill = true; previewParts.push(val); }
      else { previewParts.push('___'); }
      fi++;
    } else {
      previewParts.push(p);
    }
  });

  if (hasFill) {
    previewEl.textContent = '→ ' + previewParts.join('');
    previewEl.style.display = '';
  } else {
    previewEl.style.display = 'none';
  }
}

function updateImportCount() {
  var checked = 0;
  var total = libraryItems.length;
  for (var key in importBlanks) {
    if (importBlanks[key].checked) checked++;
  }

  var countEl = document.getElementById('libraryModalCount');
  var importBtn = document.getElementById('libraryModalImport');

  countEl.textContent = '已选 ' + checked + ' / ' + total + ' 项';
  importBtn.disabled = checked === 0;
  importBtn.textContent = checked > 0 ? '导入选中 ' + checked + ' 项' : '导入选中';
}

// 弹窗复选框点击
document.getElementById('libraryModalBody').addEventListener('click', function(e) {
  var check = e.target.closest('[data-check]');
  if (!check) return;

  var idx = parseInt(check.dataset.check);
  if (importBlanks[idx] === undefined) return;

  // 切换选中状态
  importBlanks[idx].checked = !importBlanks[idx].checked;
  check.classList.toggle('checked');

  // 高亮条目背景
  var item = check.closest('.library-import-item');
  if (item) item.classList.toggle('checked');

  updateImportCount();
});

// 取消
document.getElementById('libraryModalCancel').addEventListener('click', function() {
  document.getElementById('libraryModal').classList.add('hidden');
});

// 导入
document.getElementById('libraryModalImport').addEventListener('click', function() {
  var newTasks = [];

  libraryItems.forEach(function(item, idx) {
    var blank = importBlanks[idx];
    if (!blank || !blank.checked) return;

    var title = item.pattern;
    // 如果有 __，替换为填写的内容
    if (item.pattern.indexOf('__') !== -1) {
      var parts = splitPattern(item.pattern);
      var fi = 0;
      var filled = '';
      parts.forEach(function(p) {
        if (p === '__') {
          filled += (blank.fills[fi] && blank.fills[fi].trim()) || '__';
          fi++;
        } else {
          filled += p;
        }
      });
      title = filled;
    }

    // 跳过还有未填 __ 的
    if (title.indexOf('__') !== -1) return;

    newTasks.push({
      id: Date.now() + Math.random() * 1000 + idx,
      title: title,
      completed: false,
      doneSettled: false,
      _fresh: true,
    });
  });

  if (newTasks.length === 0) return;

  // 添加到今天的任务
  state.tasks = state.tasks.concat(newTasks);
  renderTasks();
  debouncedSave();
  document.getElementById('libraryModal').classList.add('hidden');

  // 切换到任务页
  switchPage('tasks');

  // 滚动到最新任务
  setTimeout(function() {
    var cards = document.querySelectorAll('.task-card');
    if (cards.length > 0) {
      cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }, 200);
});

document.getElementById('libraryModal').addEventListener('click', function(e) {

// 复盘状态
var reviewState = {
  score: 5,
  uncompletedItems: [], // [{taskId, title, difficulty, solution}]
  saved: true,
  dragging: false,
};

function setScore(value) {
  value = Math.max(1, Math.min(10, Math.round(value)));
  reviewState.score = value;
  reviewState.saved = false;

  var numEl = document.getElementById('scoreNumber');
  var moodEl = document.getElementById('scoreMood');
  var knob = document.getElementById('scoreKnob');
  var fill = document.getElementById('scoreFill');

  if (numEl) {
    numEl.textContent = value;
    numEl.classList.remove('changing');
    void numEl.offsetWidth; // force reflow
    numEl.classList.add('changing');
    numEl.style.color = SCORE_COLORS[value - 1];
  }
  if (moodEl) moodEl.textContent = SCORE_MOODS[value - 1];
  if (knob) {
    knob.textContent = value;
    knob.style.borderColor = SCORE_COLORS[value - 1];
    knob.style.color = SCORE_COLORS[value - 1];
  }

  // 更新滑块位置
  var pct = ((value - 1) / 9) * 100;
  if (knob) knob.style.left = pct + '%';
  if (fill) fill.style.width = pct + '%';
}

// 加载复盘
async function loadReview() {
  var token = getToken();
  if (!token) return;

  // 加载今天的任务
  var todayTasks = [];
  try {
    var res = await fetch('/api/data?token=' + encodeURIComponent(token));
    if (res.status === 401) { handleAuthError(); return; }
    var data = await res.json();
    todayTasks = (data && data.tasks) || [];
  } catch(e) { todayTasks = []; }

  // 加载已有复盘数据
  var reviewData = {};
  try {
    var r = await fetch('/api/review?token=' + encodeURIComponent(token) + '&_t=' + Date.now());
    if (r.ok) reviewData = await r.json();
  } catch(e) {}

  renderReview(todayTasks, reviewData);
}

function renderReview(todayTasks, reviewData) {
  var completed = todayTasks.filter(function(t) { return t.completed; });
  var uncompleted = todayTasks.filter(function(t) { return !t.completed; });

  // 恢复评分
  var savedScore = reviewData.score || 5;
  reviewState.score = savedScore;

  // 恢复未完成任务反思
  reviewState.uncompletedItems = [];
  uncompleted.forEach(function(t) {
    var saved = (reviewData.uncompletedTasks || []).find(function(s) {
      return s.taskId === t.id;
    });
    reviewState.uncompletedItems.push({
      taskId: t.id,
      title: t.title,
      difficulty: (saved && saved.difficulty) || '',
      solution: (saved && saved.solution) || '',
    });
  });

  // 渲染评分
  setScore(savedScore);

  // 渲染已完成任务
  var doneList = document.getElementById('reviewCompletedList');
  if (completed.length > 0) {
    var doneHtml = '<div class="review-task-list">';
    completed.forEach(function(t) {
      doneHtml += '<div class="review-task-item done">'
        + '<span class="review-task-bullet">✓</span>'
        + '<span class="review-task-title">' + escapeHtml(t.title) + '</span>'
        + '</div>';
    });
    doneHtml += '</div>';
    doneList.innerHTML = doneHtml;
    document.getElementById('reviewCompletedSection').style.display = '';
  } else {
    doneList.innerHTML = '<div class="review-task-list"><div class="review-task-item" style="color:var(--text-muted);font-size:0.95rem;">还没有完成的任务</div></div>';
    document.getElementById('reviewCompletedSection').style.display = '';
  }

  // 渲染未完成任务
  var unList = document.getElementById('reviewUncompletedList');
  var allDone = document.getElementById('reviewAllDone');

  if (uncompleted.length > 0) {
    unList.style.display = '';
    allDone.style.display = 'none';
    var unHtml = '<div class="review-task-list">';
    reviewState.uncompletedItems.forEach(function(item, idx) {
      unHtml += '<div class="review-task-item pending" data-idx="' + idx + '">'
        + '<span class="review-task-bullet">' + (idx + 1) + '</span>'
        + '<span class="review-task-title">' + escapeHtml(item.title) + '</span>'
        + '</div>'
        + '<div class="review-reflection" data-idx="' + idx + '">'
          + '<div class="review-reflection-field">'
            + '<label>🤔 遇到了什么困难？</label>'
            + '<textarea data-difficulty="' + idx + '" placeholder="描述一下遇到的困难…" rows="2">' + escAttr(item.difficulty) + '</textarea>'
          + '</div>'
          + '<div class="review-reflection-field">'
            + '<label>💡 打算怎么解决？</label>'
            + '<textarea data-solution="' + idx + '" placeholder="想一下解决计划…" rows="2">' + escAttr(item.solution) + '</textarea>'
          + '</div>'
        + '</div>';
    });
    unHtml += '</div>';
    unList.innerHTML = unHtml;

    // 绑定 textarea 变化监听
    unList.querySelectorAll('textarea[data-difficulty]').forEach(function(ta) {
      ta.addEventListener('input', function() {
        var idx = parseInt(this.dataset.difficulty);
        if (reviewState.uncompletedItems[idx]) {
          reviewState.uncompletedItems[idx].difficulty = this.value;
          reviewState.saved = false;
        }
      });
    });
    unList.querySelectorAll('textarea[data-solution]').forEach(function(ta) {
      ta.addEventListener('input', function() {
        var idx = parseInt(this.dataset.solution);
        if (reviewState.uncompletedItems[idx]) {
          reviewState.uncompletedItems[idx].solution = this.value;
          reviewState.saved = false;
        }
      });
    });
  } else {
    unList.style.display = 'none';
    allDone.style.display = '';
  }

  // 如果已有保存记录，标记已保存状态
  if (reviewData.score) {
    reviewState.saved = true;
    document.querySelectorAll('.review-section').forEach(function(el) {
      el.classList.add('saved-indicator');
    });
    document.getElementById('reviewSaveStatus').textContent = '已保存 ✓';
    document.getElementById('reviewSaveStatus').classList.add('show');
  } else {
    document.querySelectorAll('.review-section').forEach(function(el) {
      el.classList.remove('saved-indicator');
    });
  }
}

function escAttr(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 保存复盘
async function saveReview() {
  var btn = document.getElementById('btnReviewSave');
  if (btn) btn.disabled = true;

  // 收集 textarea 最新值
  reviewState.uncompletedItems.forEach(function(item, idx) {
    var diffTa = document.querySelector('textarea[data-difficulty="' + idx + '"]');
    var solTa = document.querySelector('textarea[data-solution="' + idx + '"]');
    if (diffTa) item.difficulty = diffTa.value;
    if (solTa) item.solution = solTa.value;
  });

  var payload = {
    score: reviewState.score,
    uncompletedTasks: reviewState.uncompletedItems.map(function(item) {
      return {
        taskId: item.taskId,
        title: item.title,
        difficulty: item.difficulty,
        solution: item.solution,
      };
    }),
  };

  var token = getToken();
  try {
    var res = await fetch('/api/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, review: payload }),
    });
    if (res.status === 401) { handleAuthError(); return; }
    if (res.ok) {
      reviewState.saved = true;
      var statusEl = document.getElementById('reviewSaveStatus');
      statusEl.textContent = '已保存 ✓';
      statusEl.classList.add('show');
      document.querySelectorAll('.review-section').forEach(function(el) {
        el.classList.add('saved-indicator');
      });
      setTimeout(function() {
        statusEl.classList.remove('show');
      }, 3000);
    }
  } catch(e) {
    var statusEl = document.getElementById('reviewSaveStatus');
    statusEl.textContent = '保存失败';
    statusEl.style.color = '#c85555';
    statusEl.classList.add('show');
    setTimeout(function() {
      statusEl.classList.remove('show');
      statusEl.style.color = '';
    }, 3000);
  } finally {
    if (btn) btn.disabled = false;
  }
}

// 评分滑块交互
(function initScoreSlider() {
  var track = document.getElementById('scoreTrack');
  if (!track) return;

  function getScoreFromEvent(e) {
    var rect = track.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var pct = Math.max(0, Math.min(1, x / rect.width));
    return Math.round(pct * 9 + 1);
  }

  function onPointerDown(e) {
    e.preventDefault();
    reviewState.dragging = true;
    var score = getScoreFromEvent(e);
    setScore(score);
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    document.addEventListener('pointercancel', onPointerUp);
    document.getElementById('scoreKnob').classList.add('dragging');
  }

  function onPointerMove(e) {
    e.preventDefault();
    if (!reviewState.dragging) return;
    var score = getScoreFromEvent(e);
    setScore(score);
  }

  function onPointerUp(e) {
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
    document.removeEventListener('pointercancel', onPointerUp);
    reviewState.dragging = false;
    document.getElementById('scoreKnob').classList.remove('dragging');
    // 松开时自动保存
    if (!reviewState.saved) {
      saveReview();
    }
  }

  track.addEventListener('pointerdown', onPointerDown);
})();

// 保存按钮
document.getElementById('btnReviewSave').addEventListener('click', saveReview);
